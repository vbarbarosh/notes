services:
  authwall:
    image: vbarbarosh/authwall
    restart: unless-stopped
    environment:
      AUTHWALL_UPSTREAM_URL: http://notes:3000
      AUTHWALL_WEBSOCKETS: true
      AUTHWALL_SEED: foo:foo
    ports:
      - 3000:3000
    volumes:
      - ./data-authwall:/app/data

  notes:
    build: .
    image: vbarbarosh/notes
    restart: unless-stopped
    environment:
      YT_DLP_PROXY: ${YT_DLP_PROXY:-}
      YT_DLP_TOR: ${YT_DLP_TOR:-false}
      YT_DLP_COOKIES_FILE: ${YT_DLP_COOKIES_FILE:-}
      YT_DLP_CONFIG_FILE: ${YT_DLP_CONFIG_FILE:-}
      YT_DLP_FORCE_IPV4: ${YT_DLP_FORCE_IPV4:-false}
    volumes:
      - ./data-notes:/app/data
