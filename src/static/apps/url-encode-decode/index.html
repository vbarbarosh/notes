<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark" />
    <link href="https://unpkg.com/@picocss/pico@2.1.1/css/pico.css" rel="stylesheet">
    <link href="https://unpkg.com/@vbarbarosh/smcss@0.10.0/dist/sm.css" rel="stylesheet">
    <title>url-encode-decode</title>
    <script src="/js/theme.js"></script>
</head>
<body>

<main id="app" class="container">

<section>
    <fieldset>
        <label>
            url.decoded
            <textarea v-on:input="input_decoded" v-bind:value="decoded" rows="5"></textarea>
        </label>
    </fieldset>
    <fieldset>
        <label>
            url.encoded
            <textarea v-on:input="input_encoded" v-bind:value="encoded" rows="5"></textarea>
        </label>
    </fieldset>
    <template v-if="decoded.match(/^https?:/)">
        <a v-bind:href="decoded" target="_blank">{{ decoded }}</a>
    </template>
</section>
</main>

<script src="https://unpkg.com/jquery@4.0.0/dist/jquery.js"></script>
<script src="https://unpkg.com/bluebird@3.7.2/js/browser/bluebird.js"></script>
<script src="https://unpkg.com/vue@3.5.45/dist/vue.global.prod.js"></script>
<script>
Vue.createApp({
    // keep the spaces between tags, as Vue 2 did
    compilerOptions: {whitespace: 'preserve'},
    data: function () {
        return {
            encoded: '',
            decoded: '',
        };
    },
    methods: {
        input_encoded: function (event) {
            const {value} = event.currentTarget;
            this.encoded = value;
            this.decoded = decodeURIComponent(value);
        },
        input_decoded: function (event) {
            const {value} = event.currentTarget;
            this.encoded = encodeURIComponent(value);
            this.decoded = value;
        },
    },
    created: function () {
        this.input_decoded({currentTarget: {value: 'https://example.com/path/to/page.html?a=1&b=2&c=3'}});
    }
}).mount('#app');
</script>

</body>
</html>
