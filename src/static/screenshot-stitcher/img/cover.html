<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Screenshot Stitcher cover</title>
<style>
:root {
    --bg: #F4F5F7;
    --line: #DDE1E6;
    --paper: #FFFFFF;
    --ink: #1B1F23;
    --muted: #65707C;
    --text-line: #C9CFD6;
    --accent: #2F6FEB;
    --accent-soft: #DCE7FD;
    --seam: #E5367A;
    --warm: #F2A541;
    --lime: #9BD14B;
    --shadow: rgba(27, 31, 35, 0.16);
}
html.dark {
    --bg: #15181C;
    --line: #23282E;
    --paper: #1D2126;
    --ink: #E6E8EB;
    --muted: #939CA6;
    --text-line: #3A424B;
    --accent: #5B8EF0;
    --accent-soft: #24334F;
    --seam: #FF5C9A;
    --warm: #E0A43A;
    --lime: #7FB33A;
    --shadow: rgba(0, 0, 0, 0.5);
}
* {
    box-sizing: border-box;
}
html, body {
    width: 1280px;
    height: 640px;
    margin: 0;
    overflow: hidden;
}
body {
    position: relative;
    background:
        linear-gradient(var(--line) 1px, transparent 1px),
        linear-gradient(90deg, var(--line) 1px, transparent 1px),
        var(--bg);
    background-size: 40px 40px;
    background-position: 20px 20px;
    color: var(--ink);
    font-family: Inter, ui-sans-serif, system-ui, sans-serif;
}
.hero {
    position: absolute;
    top: 0;
    bottom: 0;
    left: 72px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    width: 600px;
}
.eyebrow {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 26px;
    font-family: "JetBrains Mono", "Noto Sans Mono", "DejaVu Sans Mono", monospace;
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 0.14em;
    text-transform: uppercase;
}
.eyebrow::before {
    width: 12px;
    height: 12px;
    border: 2px solid var(--ink);
    background: var(--seam);
    content: "";
}
h1 {
    margin: 0 0 26px;
    font-size: 104px;
    font-weight: 900;
    letter-spacing: -0.06em;
    line-height: 0.9;
}
h1 span {
    display: block;
    color: var(--accent);
}
.lede {
    max-width: 520px;
    margin: 0;
    color: var(--muted);
    font-size: 22px;
    line-height: 1.4;
}
.lede b {
    color: var(--ink);
    font-weight: 700;
}
.shot {
    position: absolute;
    width: 170px;
    border-radius: 8px;
    background: var(--paper);
    box-shadow: 0 0 0 1px var(--line), 0 10px 24px var(--shadow);
    overflow: hidden;
}
.shot-window {
    height: 200px;
}
.shot-result {
    height: 500px;
    box-shadow: 0 0 0 2px var(--accent), 10px 10px 0 var(--accent-soft), 0 16px 32px var(--shadow);
}
.header {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    display: flex;
    align-items: center;
    gap: 5px;
    height: 22px;
    padding: 0 10px;
    background: var(--ink);
    z-index: 1;
}
.header i {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--bg);
    opacity: 0.6;
}
.header b {
    width: 40px;
    height: 5px;
    margin-left: auto;
    border-radius: 3px;
    background: var(--bg);
    opacity: 0.4;
}
.content {
    position: absolute;
    left: 0;
    right: 0;
    height: 478px;
}
.block {
    position: absolute;
    left: 12px;
    border-radius: 3px;
}
.badge {
    position: absolute;
    top: 30px;
    right: 8px;
    width: 22px;
    height: 22px;
    border-radius: 50%;
    background: var(--ink);
    color: var(--bg);
    font-size: 12px;
    font-weight: 800;
    line-height: 22px;
    text-align: center;
    z-index: 2;
}
.seam {
    position: absolute;
    left: -6px;
    right: -6px;
    height: 0;
    border-top: 2px dashed var(--seam);
    z-index: 2;
}
.arrow {
    position: absolute;
    top: 296px;
    left: 956px;
    color: var(--seam);
    font-size: 44px;
    font-weight: 900;
}
</style>
</head>
<body>
<div class="hero">
    <div class="eyebrow">screenshot stitcher</div>
    <h1>Scroll, snap,<span>stitch.</span></h1>
    <p class="lede">Screenshots of one page at different scroll positions become
    <b>one image</b>: positions found, sticky bars kept once, saved as PNG or
    copied to the clipboard.</p>
</div>
<div id="shots"></div>
<div class="arrow">→</div>
<script>
    // One mini page; every screenshot is a window onto it, the result is all of it.
    const BLOCKS = [
        [10, 8, 118, 'ink'], [26, 5, 140, 'text'], [36, 5, 108, 'text'],
        [52, 60, 146, 'accent-soft'],
        [126, 7, 92, 'ink'], [140, 5, 146, 'text'], [150, 5, 128, 'text'], [160, 5, 100, 'text'],
        [178, 70, 146, 'warm'],
        [262, 7, 120, 'ink'], [276, 5, 146, 'text'], [286, 5, 116, 'text'],
        [302, 50, 68, 'lime'], [302, 50, 68, 'accent', 78],
        [366, 7, 84, 'ink'], [380, 5, 146, 'text'], [390, 5, 132, 'text'],
        [406, 52, 146, 'accent-soft'],
        [466, 5, 110, 'text'],
    ];
    const WINDOWS = [
        {x: 700, y: 70, offset: 0},
        {x: 730, y: 220, offset: 150},
        {x: 760, y: 370, offset: 300},
    ];

    main();

    function main()
    {
        const shots = document.getElementById('shots');
        for (let i = 0, end = WINDOWS.length; i < end; ++i) {
            const w = WINDOWS[i];
            shots.append(render_shot('shot shot-window', w.x, w.y, w.offset, i + 1));
        }
        const result = render_shot('shot shot-result', 1030, 70, 0, null);
        for (const seam of [22 + 175, 22 + 325]) {
            const div = document.createElement('div');
            div.className = 'seam';
            div.style.top = `${seam}px`;
            result.append(div);
        }
        shots.append(result);
    }

    function render_shot(class_name, x, y, offset, badge)
    {
        const out = document.createElement('div');
        out.className = class_name;
        out.style.left = `${x}px`;
        out.style.top = `${y}px`;
        out.innerHTML = '<div class="header"><i></i><i></i><i></i><b></b></div>';
        const content = document.createElement('div');
        content.className = 'content';
        content.style.top = `${22 - offset}px`;
        for (const [top, h, w, color, left] of BLOCKS) {
            const block = document.createElement('div');
            block.className = 'block';
            block.style.cssText = `top: ${top}px; height: ${h}px; width: ${w}px; background: var(--${color === 'text' ? 'text-line' : color});`;
            if (left) {
                block.style.left = `${12 + left}px`;
            }
            content.append(block);
        }
        out.append(content);
        if (badge) {
            const div = document.createElement('div');
            div.className = 'badge';
            div.textContent = badge;
            out.append(div);
        }
        return out;
    }
</script>
</body>
</html>
